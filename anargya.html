<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Registrasi | Anargya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); padding: 40px;
            width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); color: #fff; text-align: center;
        }
        .glass-card h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .glass-card p { font-size: 14px; font-weight: 300; margin-bottom: 30px; color: #e2e8f0; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 8px; color: #f1f5f9; }
        .form-group input {
            width: 100%; padding: 12px 15px; border-radius: 8px; border: none;
            background: rgba(255, 255, 255, 0.9); color: #333; font-size: 14px; outline: none; transition: all 0.3s ease;
        }
        .form-group input:focus { box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.5); }
        .btn-submit {
            width: 100%; padding: 15px; background: #fff; color: #764ba2; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .btn-download {
            background: #27ae60; color: #fff; margin-top: 10px;
        }
        .btn-download:hover { background: #219653; }
        #barcodeSection { display: none; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); }
        #qrcode { display: flex; justify-content: center; background: #fff; padding: 15px; border-radius: 10px; width: fit-content; margin: 0 auto; }
        .warning-text { color: #ffcccc; font-weight: 600; font-size: 12px; margin: 15px 0; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Anargya</h1>
        <p>Portal Registrasi Event Internal</p>

        <form id="regForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="userName" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label>ID Karyawan / Peserta</label>
                <input type="text" id="userId" placeholder="Masukkan ID" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <!-- Menutup visibilitas password -->
                <input type="password" id="userPass" placeholder="Masukkan password" required>
            </div>
            
            <button type="button" class="btn-submit" onclick="generateCode()">Generate Barcode</button>
        </form>

        <!-- Area Hasil Barcode -->
        <div id="barcodeSection">
            <div id="qrcode"></div>
            <p class="warning-text">
                ⚠️ PENTING: Harap simpan barcode ini baik-baik dan perlihatkan ke Crew FGAS bila perlu.
            </p>
            <button type="button" class="btn-submit btn-download" onclick="downloadBarcode()">📥 Simpan Barcode ke HP</button>
        </div>
    </div>

    <script>
        function generateCode() {
            const name = document.getElementById('userName').value;
            if(!name) return alert("Isi nama terlebih dahulu!");
            
            document.getElementById('barcodeSection').style.display = 'block';
            document.getElementById('qrcode').innerHTML = ""; 
            
            // Generate QR Code sebagai pengganti Barcode sementara
            new QRCode(document.getElementById("qrcode"), {
                text: "FGAS-" + name + "-" + Math.random().toString(36).substr(2, 5),
                width: 150,
                height: 150
            });
        }

        function downloadBarcode() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const imageUrl = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = 'Tiket_FGAS.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert("Barcode gagal dimuat!");
            }
        }
    </script>
</body>
</html>
