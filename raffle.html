<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doorprize Raffle | FGAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .raffle-container { text-align: center; background: #fff; padding: 50px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); width: 90%; max-width: 700px; }
        h1 { color: #2c3e50; font-size: 2.5em; margin-bottom: 10px; }
        #eventLogo { max-height: 120px; display: none; margin: 0 auto 20px; }
        #raffleResult { font-size: 6em; font-weight: bold; color: #e67e22; margin: 30px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .warning-box { background: #ffefef; border-left: 6px solid #e74c3c; padding: 20px; text-align: left; border-radius: 4px; margin-top: 20px; }
        .warning-box p { margin: 5px 0; color: #c0392b; font-size: 1.1em; }
        .warning-title { font-weight: bold; font-size: 1.3em !important; }
        button { background: #3498db; color: #fff; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="raffle-container">
    <img id="eventLogo" src="" alt="Event Logo">
    
    <h1>PENGUNDIAN DOORPRIZE</h1>
    
    <div id="raffleResult">0000</div>
    <button onclick="startRaffle()">Acak Pemenang</button>

    <div class="warning-box">
        <p class="warning-title">⚠️ ATURAN DOORPRIZE:</p>
        <p>Pemenang yang dipanggil <strong>3x berturut-turut TIDAK HADIR</strong>, maka hadiah dinyatakan <strong>HANGUS</strong> dan diundi kembali.</p>
    </div>
</div>

<script>
    // Ambil logo dari LocalStorage yang disetting admin
    window.onload = () => {
        const savedLogo = localStorage.getItem('adminRaffleLogo');
        if (savedLogo) {
            const logoImg = document.getElementById('eventLogo');
            logoImg.src = savedLogo;
            logoImg.style.display = 'block';
        }
    };

    function startRaffle() {
        const result = document.getElementById('raffleResult');
        let counter = 0;
        const interval = setInterval(() => {
            result.innerText = Math.floor(1000 + Math.random() * 9000);
            counter++;
            if(counter > 20) {
                clearInterval(interval);
                result.innerText = "FGAS-" + Math.floor(1000 + Math.random() * 9000); // Hasil akhir simulasi
            }
        }, 100);
    }
</script>

</body>
</html>
