<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Internal - Panitia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded shadow">
        <h1 class="text-3xl font-bold mb-6">Admin Internal Panitia FGAS</h1>
        <p class="mb-6 text-gray-600">Halaman khusus untuk setup Logo Penyelenggara dan Sponsor Acara.</p>
        
        <div class="border p-4 rounded mb-4">
            <h2 class="font-bold mb-2">Upload Logo Penyelenggara</h2>
            <input type="file" class="mb-2">
            <button class="bg-blue-600 text-white px-4 py-2 rounded text-sm">Simpan Logo</button>
        </div>

        <div class="border p-4 rounded">
            <h2 class="font-bold mb-2">Tambah Sponsor</h2>
            <input type="text" placeholder="Nama Sponsor" class="border p-2 rounded mb-2 w-full">
            <input type="file" class="mb-2 block">
            <button class="bg-green-600 text-white px-4 py-2 rounded text-sm">Tambah Sponsor</button>
        </div>
    </div>
</body>
</html>
