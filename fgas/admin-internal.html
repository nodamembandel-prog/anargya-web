<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Setup Visual Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-10 rounded-3xl shadow-xl border">
        <h1 class="text-2xl font-bold mb-2"><i class="fas fa-tv text-blue-500 mr-2"></i>Pengaturan Layar LED</h1>
        <p class="mb-8 text-gray-500 text-sm">Logo yang diupload di sini akan otomatis tampil di tengah atas halaman Layar Undian (Raffle).</p>
        
        <div class="border-2 border-dashed border-blue-200 p-8 rounded-2xl mb-6 bg-blue-50 text-center">
            <i class="fas fa-cloud-upload-alt text-5xl text-blue-400 mb-4 block"></i>
            <h2 class="font-bold text-gray-800 mb-2">Upload Logo Penyelenggara</h2>
            <input type="file" id="logo-upload" accept="image/*" class="text-sm text-gray-500 mx-auto block mt-4 border p-2 bg-white rounded cursor-pointer w-full">
            <button onclick="saveLogo()" class="mt-6 bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-blue-700 w-full transition text-lg">Terapkan ke Layar LED</button>
        </div>

        <div id="preview-box" class="hidden mt-6 text-center bg-gray-50 p-4 rounded-xl border">
            <p class="text-sm font-bold text-green-600 mb-2"><i class="fas fa-check-circle"></i> Logo Aktif Saat Ini:</p>
            <img id="logo-preview" src="" class="h-24 mx-auto object-contain bg-black p-2 rounded-lg">
        </div>
        
        <div class="mt-10 pt-6 border-t text-center">
            <a href="../superadmin.html" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-300 transition">Kembali ke Superadmin</a>
        </div>
    </div>

    <script>
        const existing = localStorage.getItem('fgas_raffle_logo');
        if(existing) {
            document.getElementById('preview-box').classList.remove('hidden');
            document.getElementById('logo-preview').src = existing;
        }

        function saveLogo() {
            const fileInput = document.getElementById('logo-upload');
            if(!fileInput.files[0]) { alert('Pilih gambar dulu!'); return; }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64Image = canvas.toDataURL('image/png', 0.8);
                    
                    localStorage.setItem('fgas_raffle_logo', base64Image);
                    alert('Logo berhasil dipasang di layar undian!');
                    document.getElementById('preview-box').classList.remove('hidden');
                    document.getElementById('logo-preview').src = base64Image;
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        }
    </script>
</body>
</html>
