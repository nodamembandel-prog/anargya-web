<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Master Admin FGAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-900 absolute inset-0 z-50 px-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-lock"></i></div>
            <h2 class="text-xl font-bold mb-6">Akses Admin Internal</h2>
            <input type="password" id="pwd" class="w-full p-4 bg-gray-50 border rounded-xl mb-4 text-center tracking-widest text-xl outline-none focus:border-red-500" placeholder="***">
            <button onclick="login()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold shadow-lg transition text-lg hover:bg-red-700">Masuk</button>
        </div>
    </div>

    <div id="main-content" class="hidden max-w-6xl mx-auto space-y-6">
        
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border">
            <h1 class="text-xl font-bold"><i class="fas fa-user-secret text-blue-500 mr-2"></i>Admin Internal (Master)</h1>
            <a href="../superadmin.html" class="bg-gray-200 px-4 py-2 rounded font-bold text-sm">Kembali</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- VOUCHER GENERATOR -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-purple-200">
                <h2 class="font-bold text-xl mb-2 text-purple-800"><i class="fas fa-ticket-alt mr-2"></i>Generator Voucher Makan</h2>
                <p class="text-xs text-gray-500 mb-4 font-bold bg-purple-50 p-2 rounded border border-purple-100">Buat voucher Rp 10.000 untuk pengunjung. Otomatis tersinkron ke Spreadsheet.</p>
                <div class="space-y-4">
                    <input type="number" id="voucher-qty" class="w-full p-4 bg-gray-50 border border-gray-300 rounded-xl font-bold text-lg outline-none focus:border-purple-500" placeholder="Jumlah Voucher (Misal: 50)">
                    <button id="btn-generate-voucher" onclick="generateVoucher()" class="w-full bg-purple-600 text-white py-4 rounded-xl font-black text-lg shadow-lg hover:bg-purple-700 transition">GENERATE & SIMPAN KE DB</button>
                </div>
                <div id="voucher-print-area" class="mt-4 grid grid-cols-2 gap-2 max-h-[300px] overflow-y-auto"></div>
            </div>

            <!-- Winner Setup -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-blue-200">
                <h2 class="font-bold text-xl mb-2 text-blue-800"><i class="fas fa-trophy mr-2"></i>Setup Pemenang Undian</h2>
                <p class="text-xs text-gray-500 mb-6 font-bold bg-blue-50 p-2 rounded border border-blue-100">Kunci pemenang doorprize untuk verifikasi panitia & tayang LED.</p>
                <div class="space-y-4">
                    <input type="text" id="target-winner" class="w-full p-4 bg-gray-50 border border-gray-300 rounded-xl font-bold text-lg outline-none focus:border-blue-500" placeholder="Target ID / Nama Pemenang">
                    <input type="text" id="target-prize" class="w-full p-4 bg-gray-50 border border-gray-300 rounded-xl font-bold text-lg outline-none focus:border-blue-500" placeholder="Target Hadiah">
                    <button onclick="setWinner()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-lg shadow-lg hover:bg-blue-700">KUNCI PEMENANG</button>
                    <a href="raffle.html" target="_blank" class="block w-full bg-slate-800 text-white py-3 rounded-xl font-bold text-center hover:bg-slate-700 mt-2 shadow"><i class="fas fa-desktop mr-2"></i> Buka Layar LED Undian</a>
                </div>
            </div>

            <!-- Logistik & Visual -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border col-span-1 md:col-span-2">
                <h2 class="font-bold text-lg mb-4 text-orange-800"><i class="fas fa-images mr-2"></i>Setup Visual Aset LED</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="border p-4 rounded-xl bg-gray-50">
                        <label class="text-xs font-bold text-gray-500 block mb-2">Logo Utama (Tengah)</label>
                        <input type="file" id="main-logo-upload" accept="image/*" class="w-full text-xs mb-2"><button onclick="setMainLogo()" class="bg-blue-600 text-white px-2 py-1 rounded text-xs w-full">Set Logo</button>
                    </div>
                    <div class="border p-4 rounded-xl bg-gray-50">
                        <label class="text-xs font-bold text-gray-500 block mb-2">Logo Kanan Atas</label>
                        <input type="file" id="top-logo-upload" accept="image/*" class="w-full text-xs mb-2"><button onclick="addTopLogo()" class="bg-green-600 text-white px-2 py-1 rounded text-xs w-full">Tambah</button>
                    </div>
                    <div class="border p-4 rounded-xl bg-gray-50">
                        <label class="text-xs font-bold text-gray-500 block mb-2">Sponsor (Bawah)</label>
                        <input type="file" id="sponsor-logo-upload" accept="image/*" class="w-full text-xs mb-2"><button onclick="addSponsorLogo()" class="bg-purple-600 text-white px-2 py-1 rounded text-xs w-full">Tambah</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwz3ebZOsF6qDjFlrcapiv-ElcUT1CKtFnhDkAMsLndQHGD8G3fldUrVBkBAfRMe7x1/exec'; 

        function login() {
            if(document.getElementById('pwd').value === 'amansekali') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            } else { alert('Gagal'); document.getElementById('pwd').value = ''; }
        }

        function setWinner() {
            localStorage.setItem('fgas_target_winner', document.getElementById('target-winner').value);
            localStorage.setItem('fgas_target_prize', document.getElementById('target-prize').value);
            alert('Pemenang berhasil dikunci!');
        }

        async function generateVoucher() {
            const qty = parseInt(document.getElementById('voucher-qty').value);
            if(!qty || qty < 1) { alert("Masukkan jumlah yang benar"); return; }
            
            const btn = document.getElementById('btn-generate-voucher');
            btn.innerText = "MENYIMPAN KE DATABASE..."; btn.disabled = true;

            const vouchers = [];
            for(let i=0; i<qty; i++) {
                vouchers.push('VOUCHER-FGAS-' + Math.floor(Math.random() * 10000000));
            }

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'generate_voucher', vouchers: vouchers })
                });
                const result = await res.json();
                
                if(result.status === 'success') {
                    alert(qty + " Voucher berhasil masuk database!");
                    const container = document.getElementById('voucher-print-area');
                    container.innerHTML = '';
                    vouchers.forEach(v => {
                        const div = document.createElement('div');
                        div.className = 'border p-2 bg-gray-50 flex flex-col items-center justify-center rounded';
                        div.innerHTML = `<div id="qr-${v}" class="mb-1"></div><p class="text-[10px] font-mono font-bold">${v}</p>`;
                        container.appendChild(div);
                        new QRCode(document.getElementById(`qr-${v}`), { text: v, width: 80, height: 80 });
                    });
                }
            } catch(e) { alert("Gagal koneksi ke database."); }
            btn.innerText = "GENERATE & SIMPAN KE DB"; btn.disabled = false;
        }

        function compressAndSave(fileInputId, storageKey, isArray = false) {
            const fileInput = document.getElementById(fileInputId);
            if(!fileInput.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const base64Image = canvas.toDataURL('image/png', 0.8);
                    
                    if(isArray) {
                        let arr = JSON.parse(localStorage.getItem(storageKey)) || [];
                        arr.push(base64Image); localStorage.setItem(storageKey, JSON.stringify(arr));
                    } else { localStorage.setItem(storageKey, base64Image); }
                    alert('Logo disimpan!'); fileInput.value = '';
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function setMainLogo() { compressAndSave('main-logo-upload', 'fgas_raffle_logo', false); }
        function addTopLogo() { compressAndSave('top-logo-upload', 'fgas_top_logos', true); }
        function addSponsorLogo() { compressAndSave('sponsor-logo-upload', 'fgas_sponsor_logos', true); }
    </script>
</body>
</html>
