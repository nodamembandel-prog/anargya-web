<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>VJ Control Panel - FGAS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { max-width: 100%; overflow-x: hidden; }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap'); body { background: #0f172a; color: white; font-family: sans-serif; } .vj-panel { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); transition: bottom 0.3s ease; } .vj-panel:hover { bottom: 0 !important; } input {font-size:16px; box-sizing: border-box;} 
    </style>
</head>
<body class="h-screen w-full overflow-hidden">
    <iframe id="display-frame" src="raffle.html" class="w-full h-full border-none"></iframe>

    <div class="vj-panel fixed left-0 w-full p-6 border-t border-blue-500/50 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-50 flex flex-col gap-4" style="bottom: -85vh; height: 90vh;">
        <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <h2 class="font-bold text-xl text-cyan-400"><i class="fas fa-sliders-h mr-2"></i> VJ CONTROL PANEL (Arahkan mouse ke bawah untuk membuka)</h2>
            <div class="flex items-center gap-3">
                <span id="sync-badge" class="bg-slate-800 border border-slate-600 text-slate-300 px-3 py-1 rounded-full text-xs font-bold transition-colors">Connecting...</span>
                <div class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs font-bold animate-pulse">VJ MODE ACTIVE</div>
            </div>
        </div>
        
        <div class="grid grid-cols-2 gap-8 h-full overflow-y-auto pb-10">
            <div class="bg-white/5 p-6 rounded-xl border border-white/10 space-y-4">
                <div class="flex justify-between items-center border-b border-white/10 pb-2">
                    <h3 class="font-bold text-orange-400 text-lg">1. PENGUNDIAN DOORPRIZE</h3>
                    <button onclick="resetDrawnTickets()" class="text-xs text-red-400 hover:text-red-300 underline"><i class="fas fa-trash mr-1"></i>Reset Kupon Terpilih</button>
                </div>
                <input type="text" id="target-winner" class="w-full p-3 bg-black/50 border border-white/20 rounded text-white" placeholder="Nama / ID Pemenang (Kosongkan = Acak Otomatis)">
                <input type="text" id="target-prize" class="w-full p-3 bg-black/50 border border-white/20 rounded text-white" placeholder="Hadiah (Motor, Kulkas, dll)">
                <input type="text" id="target-sponsor" class="w-full p-3 bg-black/50 border border-white/20 rounded text-white" placeholder="Sponsor (opsional, cth: Bank Jateng)">
                <button onclick="setRaffle()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold transition">SET DATA KE LAYAR LED</button>
                <button onclick="document.getElementById('display-frame').src='raffle.html'" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded font-bold transition text-xs">RESET TAMPILAN UNDIAN</button>
            </div>

            <div class="bg-white/5 p-6 rounded-xl border border-white/10 space-y-4">
                <h3 class="font-bold text-pink-400 text-lg border-b border-white/10 pb-2">2. PENGUMUMAN JUARA LOMBA</h3>
                <p class="text-xs text-gray-400">Atur pemenang dan tampilkan podium dramatis di Layar LED.</p>
                <input type="text" id="kategori-lomba" class="w-full p-3 bg-black/50 border border-white/20 rounded text-white" placeholder="Nama Lomba (Cth: Fashion Show Anak)">
                
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="juara-3" class="w-full p-3 bg-[#cd7f32]/20 border border-[#cd7f32] rounded text-white placeholder-[#cd7f32]" placeholder="Nama Juara 3">
                    <input type="text" id="juara-2" class="w-full p-3 bg-gray-400/20 border border-gray-400 rounded text-white placeholder-gray-400" placeholder="Nama Juara 2">
                    <input type="text" id="juara-1" class="w-full p-3 bg-yellow-400/20 border border-yellow-400 rounded text-white placeholder-yellow-400" placeholder="Nama Juara 1">
                </div>
                <button onclick="triggerPodium()" class="w-full bg-pink-600 hover:bg-pink-500 py-3 rounded font-bold transition">TAMPILKAN PODIUM DI LED</button>
            </div>
        </div>
    </div>

    <script>
        const _0xUrl = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3ejNlYlpPc0Y2cURqRmxyY2FwaXYtRWxjVVQxQ0t0Rm5oRGtBTXNMbmRRSEdEOEczZmxkVXJWQmtCQWZSTWU3eDEvZXhlYw==';
        const SCRIPT_URL = atob(_0xUrl);
        const APP_TOKEN = 'FGAS_SECRET_2026';

        async function fetchData() {
            try {
                const res = await fetch(SCRIPT_URL + "?token=" + APP_TOKEN);
                const data = await res.json();
                if(data.visitors) {
                    localStorage.setItem('fgas_visitors', JSON.stringify(data.visitors));
                }
                const badge = document.getElementById('sync-badge');
                badge.className = "bg-green-900 border border-green-500 text-green-400 px-3 py-1 rounded-full text-xs font-bold transition-colors";
                badge.innerHTML = '<span class="w-2 h-2 inline-block rounded-full bg-green-400 animate-pulse mr-1"></span> Live Data Synced';
                setTimeout(() => {
                    badge.className = "bg-slate-800 border border-slate-600 text-slate-300 px-3 py-1 rounded-full text-xs font-bold transition-colors";
                    badge.innerHTML = 'Standby';
                }, 3000);
            } catch(e) {}
        }
        
        fetchData();
        setInterval(fetchData, 10000);

        function resetDrawnTickets() {
            if(confirm("Yakin ingin mereset riwayat pemenang undian? Kupon yang sudah menang akan bisa terpilih menang lagi.")) {
                localStorage.removeItem('fgas_drawn_tickets');
                alert("Berhasil direset!");
            }
        }

        function setRaffle() {
            localStorage.setItem('fgas_target_winner', document.getElementById('target-winner').value);
            localStorage.setItem('fgas_target_prize', document.getElementById('target-prize').value);
            localStorage.setItem('fgas_target_sponsor', document.getElementById('target-sponsor').value);
            document.getElementById('display-frame').src = 'raffle.html';
        }

        function triggerPodium() {
            const lomba = document.getElementById('kategori-lomba').value || "PENGUMUMAN LOMBA";
            const j1 = document.getElementById('juara-1').value || "-";
            const j2 = document.getElementById('juara-2').value || "-";
            const j3 = document.getElementById('juara-3').value || "-";

            // SAVE WINNERS TO LOCALSTORAGE SO PREVIEW DASHBOARD CAN READ IT
            const winners = JSON.parse(localStorage.getItem('fgas_winners') || "[]");
            winners.push(`${lomba.toUpperCase()}<br><span class='text-white mt-1 block font-normal text-[10px]'>1st: ${j1} &bull; 2nd: ${j2} &bull; 3rd: ${j3}</span>`);
            localStorage.setItem('fgas_winners', JSON.stringify(winners));

            const podiumHTML = `<!DOCTYPE html>
            <html lang="id">
            <head>
                <meta charset="UTF-8">
                <script src="https://cdn.tailwindcss.com"></`+`script>
                <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></`+`script>
                <style>
                    html, body { max-width: 100%; overflow-x: hidden; }
                    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
                    body { background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #000 100%); color: #fff; overflow: hidden; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
                    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; margin-top: 5vh; height: 40vh; }
                    .pillar { width: 15vw; text-align: center; border-radius: 10px 10px 0 0; position: relative; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
                    .p2 { height: 60%; background: linear-gradient(to top, #475569, #94a3b8); }
                    .p1 { height: 100%; background: linear-gradient(to top, #854d0e, #fbbf24); z-index: 10; }
                    .p3 { height: 40%; background: linear-gradient(to top, #78350f, #cd7f32); }
                    .name-card { position: absolute; top: -10vh; left: 50%; transform: translateX(-50%); width: 200%; background: rgba(0,0,0,0.8); border: 2px solid #fff; padding: 1rem; border-radius: 10px; font-size: 2vw; opacity: 0; transition: opacity 1s; }
                    .rank { font-size: 4vw; font-weight: 900; margin-top: 2vh; color: rgba(255,255,255,0.5); }
                </style>
            </head>
            <body>
                <h1 class="text-[4vw] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400 tracking-widest uppercase mb-2">PENGUMUMAN JUARA</h1>
                <h2 class="text-[3vw] text-white tracking-[0.2em] mb-10">${lomba.toUpperCase()}</h2>
                
                <div class="podium">
                    <div class="pillar p2"><div class="name-card" id="n2" style="border-color: #94a3b8;">${j2}</div><div class="rank">2</div></div>
                    <div class="pillar p1"><div class="name-card" id="n1" style="border-color: #fbbf24; top: -15vh; font-size: 3vw; color: #fbbf24;">${j1}</div><div class="rank text-white">1</div></div>
                    <div class="pillar p3"><div class="name-card" id="n3" style="border-color: #cd7f32;">${j3}</div><div class="rank">3</div></div>
                </div>

                <script>
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    function beep(freq, type, dur) { const osc = audioCtx.createOscillator(); osc.type = type; osc.frequency.value = freq; osc.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur); }
                    
                    setTimeout(() => { document.getElementById('n3').style.opacity = 1; beep(300, 'square', 0.5); }, 2000);
                    setTimeout(() => { document.getElementById('n2').style.opacity = 1; beep(400, 'square', 0.5); }, 5000);
                    setTimeout(() => { 
                        document.getElementById('n1').style.opacity = 1; beep(600, 'triangle', 1.5); 
                        confetti({ particleCount: 300, spread: 160, origin: { y: 0.2 }}); 
                    }, 9000);
                </`+`script>
            </body>
            </html>`;
            
            const blob = new Blob([podiumHTML], {type: 'text/html'});
            document.getElementById('display-frame').src = URL.createObjectURL(blob);
        }
    </script>
</body>
</html>
