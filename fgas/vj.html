<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VJ Control Panel - FGAS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body { max-width: 100%; overflow: hidden; }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .vj-panel { background: rgba(2,6,23,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: bottom 0.3s ease; }
        .vj-panel:hover, .vj-panel.open { bottom: 0 !important; }
        input { font-size: 15px; box-sizing: border-box; }
    </style>
</head>
<body class="h-screen w-full overflow-hidden relative">
    <iframe id="display-frame" src="raffle.html" class="w-full h-full border-none"></iframe>

    <div id="vj-drawer" class="vj-panel fixed left-0 w-full p-5 border-t border-cyan-500/50 shadow-[0_-10px_30px_rgba(0,0,0,0.7)] z-50 flex flex-col gap-4" style="bottom: -86vh; height: 90vh;">
        <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <h2 class="font-bold text-lg text-cyan-400"><i class="fas fa-sliders-h mr-2"></i> VJ CONTROL PANEL (Arahkan mouse ke bawah)</h2>
            <div class="flex items-center gap-2">
                <button onclick="toggleFullscreen()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition"><i class="fas fa-expand mr-1"></i> Fullscreen LED</button>
                <span id="sync-badge" class="bg-slate-800 border border-slate-600 text-slate-300 px-3 py-1 rounded-full text-xs font-bold">Standby</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 h-full overflow-y-auto pb-10">
            <!-- 1. KONTROL UNDIAN DOORPRIZE -->
            <div class="bg-white/5 p-5 rounded-xl border border-white/10 space-y-3">
                <div class="flex justify-between items-center border-b border-white/10 pb-2">
                    <h3 class="font-bold text-orange-400 text-sm uppercase">1. Kontrol Undian LED</h3>
                    <button onclick="resetDrawnTickets()" class="text-[11px] text-red-400 hover:text-red-300 underline"><i class="fas fa-trash mr-1"></i>Reset Kupon</button>
                </div>
                <input type="text" id="target-winner" class="w-full p-2.5 bg-black/50 border border-white/20 rounded text-white text-sm" placeholder="Nama / ID Pemenang (Kosong = Acak)">
                <input type="text" id="target-prize" class="w-full p-2.5 bg-black/50 border border-white/20 rounded text-white text-sm" placeholder="Hadiah (Motor, Kulkas, dll)">
                <input type="text" id="target-sponsor" class="w-full p-2.5 bg-black/50 border border-white/20 rounded text-white text-sm" placeholder="Sponsor (opsional)">
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="setRaffle()" class="bg-blue-600 hover:bg-blue-500 py-2.5 rounded font-bold text-xs transition">SET KE LED</button>
                    <button onclick="startRaffleOnLED()" class="bg-green-600 hover:bg-green-500 py-2.5 rounded font-black text-xs transition shadow-[0_0_15px_rgba(34,197,94,0.5)]"><i class="fas fa-play mr-1"></i> MULAI (15 DTK)</button>
                </div>
                <button onclick="resetRaffleOnLED()" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded font-bold transition text-xs">RESET LAYAR UNDIAN</button>
            </div>

            <!-- 2. REMOTE SPREADSHEET RAHASIA (TERPISAH DARI DATABASE) -->
            <div class="bg-purple-950/30 p-5 rounded-xl border border-purple-500/40 space-y-3">
                <div class="flex justify-between items-center border-b border-purple-500/30 pb-2">
                    <h3 class="font-bold text-purple-300 text-sm uppercase"><i class="fas fa-user-secret mr-1"></i> 2. Remote Sheet Rahasia</h3>
                    <button onclick="fetchSecretSheet()" class="text-[11px] bg-purple-700 hover:bg-purple-600 px-2.5 py-1 rounded font-bold"><i class="fas fa-sync-alt mr-1"></i>Sync</button>
                </div>
                <p class="text-[11px] text-purple-200/80">Terpisah & tersembunyi dari Spreadsheet Database utama. Tempel URL Web App Sheet Rahasia:</p>
                <div class="flex gap-1.5">
                    <input type="text" id="secret-sheet-url" class="w-full p-2 bg-black/60 border border-purple-400/40 rounded text-white text-xs" placeholder="https://script.google.com/macros/s/.../exec">
                    <button onclick="saveSecretSheetUrl()" class="bg-purple-600 hover:bg-purple-500 px-3 rounded text-xs font-bold shrink-0">Simpan</button>
                </div>
                <div id="remote-prize-list" class="space-y-2 max-h-44 overflow-y-auto pr-1 text-xs">
                    <p class="text-slate-400 italic">Belum terhubung ke Sheet Rahasia.</p>
                </div>
            </div>

            <!-- 3. PENGUMUMAN JUARA LOMBA -->
            <div class="bg-white/5 p-5 rounded-xl border border-white/10 space-y-3">
                <h3 class="font-bold text-pink-400 text-sm uppercase border-b border-white/10 pb-2">3. Pengumuman Juara Lomba</h3>
                <input type="text" id="kategori-lomba" class="w-full p-2.5 bg-black/50 border border-white/20 rounded text-white text-sm" placeholder="Nama Lomba (Cth: Fashion Show)">
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="juara-3" class="w-full p-2.5 bg-[#cd7f32]/20 border border-[#cd7f32] rounded text-white text-xs placeholder-[#cd7f32]" placeholder="Juara 3">
                    <input type="text" id="juara-2" class="w-full p-2.5 bg-gray-400/20 border border-gray-400 rounded text-white text-xs placeholder-gray-400" placeholder="Juara 2">
                    <input type="text" id="juara-1" class="w-full p-2.5 bg-yellow-400/20 border border-yellow-400 rounded text-white text-xs placeholder-yellow-400" placeholder="Juara 1">
                </div>
                <button onclick="triggerPodium()" class="w-full bg-pink-600 hover:bg-pink-500 py-2.5 rounded font-bold text-xs transition">TAMPILKAN PODIUM DI LED</button>
            </div>
        </div>
    </div>

    <script>
        const _0xUrl = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3ejNlYlpPc0Y2cURqRmxyY2FwaXYtRWxjVVQxQ0t0Rm5oRGtBTXNMbmRRSEdEOEczZmxkVXJWQmtCQWZSTWU3eDEvZXhlYw==';
        const SCRIPT_URL = atob(_0xUrl);
        const APP_TOKEN = 'FGAS_SECRET_2026';

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => alert("Tekan F11 untuk Fullscreen"));
            } else {
                document.exitFullscreen();
            }
        }

        async function fetchData() {
            try {
                const res = await fetch(SCRIPT_URL + "?token=" + APP_TOKEN);
                const data = await res.json();
                if(data.visitors) localStorage.setItem('fgas_visitors', JSON.stringify(data.visitors));
                const badge = document.getElementById('sync-badge');
                badge.className = "bg-green-900 border border-green-500 text-green-400 px-3 py-1 rounded-full text-xs font-bold";
                badge.innerHTML = 'Live Synced';
                setTimeout(() => {
                    badge.className = "bg-slate-800 border border-slate-600 text-slate-300 px-3 py-1 rounded-full text-xs font-bold";
                    badge.innerHTML = 'Standby';
                }, 2500);
            } catch(e) {}
        }
        fetchData();
        setInterval(fetchData, 10000);

        // --- REMOTE SECRET SHEET LOGIC ---
        function saveSecretSheetUrl() {
            const url = document.getElementById('secret-sheet-url').value.trim();
            localStorage.setItem('fgas_secret_raffle_sheet', url);
            fetchSecretSheet();
        }

        async function fetchSecretSheet() {
            const url = localStorage.getItem('fgas_secret_raffle_sheet') || "";
            document.getElementById('secret-sheet-url').value = url;
            const listDiv = document.getElementById('remote-prize-list');
            if(!url) {
                listDiv.innerHTML = '<p class="text-slate-400 italic">Tempel URL Web App Sheet Rahasia lalu klik Simpan.</p>';
                return;
            }
            try {
                const res = await fetch(url + "?token=RAHASIA_VJ_2026");
                const data = await res.json();
                if(data.items && data.items.length > 0) {
                    listDiv.innerHTML = '';
                    data.items.forEach((item, idx) => {
                        const isDone = String(item.Status || '').toLowerCase() === 'selesai';
                        const badgeCls = isDone ? 'bg-slate-700 text-slate-400' : 'bg-purple-600 text-white';
                        listDiv.innerHTML += `
                            <div class="bg-black/50 border border-purple-500/30 p-2 rounded-lg flex justify-between items-center gap-2">
                                <div class="truncate">
                                    <p class="font-bold text-white truncate">${item.Hadiah || 'Doorprize'}</p>
                                    <p class="text-[10px] text-purple-300 truncate">Target: ${item.Target_Pemenang || 'Acak Otomatis'}</p>
                                </div>
                                <button onclick='applyRemoteItem(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="${badgeCls} px-2.5 py-1.5 rounded text-[10px] font-bold shrink-0 hover:opacity-90">PAKAI</button>
                            </div>`;
                    });
                } else {
                    listDiv.innerHTML = '<p class="text-yellow-400 italic">Sheet terhubung, tapi belum ada baris hadiah.</p>';
                }
            } catch(e) {
                listDiv.innerHTML = '<p class="text-red-400 italic">Gagal terhubung. Cek URL Web App & izin akses "Anyone".</p>';
            }
        }

        function applyRemoteItem(item) {
            document.getElementById('target-prize').value = item.Hadiah || '';
            document.getElementById('target-sponsor').value = item.Sponsor || '';
            document.getElementById('target-winner').value = item.Target_Pemenang || '';
            setRaffle();
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSecretSheet();
            setInterval(fetchSecretSheet, 8000);
        });

        function resetDrawnTickets() {
            if(confirm("Yakin ingin mereset riwayat pemenang undian?")) {
                localStorage.removeItem('fgas_drawn_tickets');
                alert("Berhasil direset!");
            }
        }

        function setRaffle() {
            localStorage.setItem('fgas_target_winner', document.getElementById('target-winner').value);
            localStorage.setItem('fgas_target_prize', document.getElementById('target-prize').value);
            localStorage.setItem('fgas_target_sponsor', document.getElementById('target-sponsor').value);
            const frame = document.getElementById('display-frame');
            if(!frame.src.includes('raffle.html')) {
                frame.src = 'raffle.html';
            } else {
                frame.contentWindow.postMessage({ cmd: 'RESET_RAFFLE' }, '*');
            }
        }

        function startRaffleOnLED() {
            setRaffle();
            setTimeout(() => {
                document.getElementById('display-frame').contentWindow.postMessage({ cmd: 'START_RAFFLE' }, '*');
            }, 150);
        }

        function resetRaffleOnLED() {
            document.getElementById('display-frame').contentWindow.postMessage({ cmd: 'RESET_RAFFLE' }, '*');
        }

        function triggerPodium() {
            const lomba = document.getElementById('kategori-lomba').value || "PENGUMUMAN LOMBA";
            const j1 = document.getElementById('juara-1').value || "-";
            const j2 = document.getElementById('juara-2').value || "-";
            const j3 = document.getElementById('juara-3').value || "-";

            const winners = JSON.parse(localStorage.getItem('fgas_winners') || "[]");
            winners.push(`${lomba.toUpperCase()}<br><span class='text-white mt-1 block font-normal text-[10px]'>1st: ${j1} &bull; 2nd: ${j2} &bull; 3rd: ${j3}</span>`);
            localStorage.setItem('fgas_winners', JSON.stringify(winners));

            const podiumHTML = `<!DOCTYPE html>
            <html lang="id">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <script src="https://cdn.tailwindcss.com"></`+`script>
                <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></`+`script>
                <style>
                    html, body { max-width: 100%; overflow: hidden; }
                    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
                    body { background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #000 100%); color: #fff; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
                    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; margin-top: 5vh; height: 40vh; }
                    .pillar { width: 15vw; text-align: center; border-radius: 10px 10px 0 0; position: relative; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
                    .p2 { height: 60%; background: linear-gradient(to top, #475569, #94a3b8); }
                    .p1 { height: 100%; background: linear-gradient(to top, #854d0e, #fbbf24); z-index: 10; }
                    .p3 { height: 40%; background: linear-gradient(to top, #78350f, #cd7f32); }
                    .name-card { position: absolute; top: -10vh; left: 50%; transform: translateX(-50%); width: 200%; background: rgba(0,0,0,0.8); border: 2px solid #fff; padding: 1rem; border-radius: 10px; font-size: 2vw; opacity: 0; transition: opacity 1s; }
                    .rank { font-size: 4vw; font-weight: 900; margin-top: 2vh; color: rgba(255,255,255,0.5); }
                </style>
            </head>
            <body>
                <h1 class="text-[4vw] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400 tracking-widest uppercase mb-2">PENGUMUMAN JUARA</h1>
                <h2 class="text-[3vw] text-white tracking-[0.2em] mb-10">${lomba.toUpperCase()}</h2>
                <div class="podium">
                    <div class="pillar p2"><div class="name-card" id="n2" style="border-color: #94a3b8;">${j2}</div><div class="rank">2</div></div>
                    <div class="pillar p1"><div class="name-card" id="n1" style="border-color: #fbbf24; top: -15vh; font-size: 3vw; color: #fbbf24;">${j1}</div><div class="rank text-white">1</div></div>
                    <div class="pillar p3"><div class="name-card" id="n3" style="border-color: #cd7f32;">${j3}</div><div class="rank">3</div></div>
                </div>
                <script>
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    function beep(freq, type, dur) { const osc = audioCtx.createOscillator(); osc.type = type; osc.frequency.value = freq; osc.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur); }
                    setTimeout(() => { document.getElementById('n3').style.opacity = 1; beep(300, 'square', 0.5); }, 2000);
                    setTimeout(() => { document.getElementById('n2').style.opacity = 1; beep(400, 'square', 0.5); }, 5000);
                    setTimeout(() => { document.getElementById('n1').style.opacity = 1; beep(600, 'triangle', 1.5); confetti({ particleCount: 300, spread: 160, origin: { y: 0.2 }}); }, 9000);
                </`+`script>
            </body>
            </html>`;
            const blob = new Blob([podiumHTML], {type: 'text/html'});
            document.getElementById('display-frame').src = URL.createObjectURL(blob);
        }
    </script>
</body>
</html>
