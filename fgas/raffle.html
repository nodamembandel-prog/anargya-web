<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Undian Doorprize</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
        body { background: #000; color: #fff; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        .slot-machine { font-size: 8vw; line-height: 1; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 30px rgba(6,182,212,0.8); }
        .bg-cyber { background: radial-gradient(circle at 50% 50%, #0f172a 0%, #000 100%); }
        .glass-box { background: rgba(15,23,42,0.8); border: 2px solid #06b6d4; box-shadow: 0 0 50px rgba(6,182,212,0.4); border-radius: 40px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen w-screen bg-cyber relative p-10">
    
    <!-- Dynamic Admin Logo -->
    <img id="raffle-logo" src="" class="absolute top-10 h-28 object-contain hidden z-20 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">

    <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwb2x5Z29uIHBvaW50cz0iMCAwIDQwIDAgNDAgMSA0MCAxIDAgMSIgZmlsbD0iIzBiYmZlZSIvPjxwb2x5Z29uIHBvaW50cz0iMCAwIDEgMCAxIDQwIDEgNDAgMCA0MCIgZmlsbD0iIzBiYmZlZSIvPjwvc3ZnPg==')]"></div>

    <h1 class="text-[4.5vw] font-black mb-6 mt-20 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 relative z-10 tracking-widest uppercase text-center leading-tight drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]">
        PENGUNDIAN DOORPRIZE<br><span class="text-[2.5vw] text-white tracking-[0.5em]">FGAS BOYOLALI 2026</span>
    </h1>
    
    <div class="glass-box p-10 w-full max-w-[90vw] text-center relative z-10">
        <div id="prize-name" class="text-[2.5vw] text-cyan-400 mb-4 font-bold tracking-widest uppercase">BERSEDIA...</div>
        <div id="winner-name" class="slot-machine text-white h-[20vh] flex items-center justify-center overflow-hidden uppercase">?????</div>
    </div>

    <!-- Alert Text -->
    <div class="mt-8 bg-red-600/20 border border-red-500 p-4 rounded-xl z-10 text-center animate-pulse">
        <p class="text-3xl text-red-400 tracking-widest font-bold">PANGGILAN 3X TIDAK HADIR = HADIAH HANGUS!</p>
    </div>

    <div class="absolute bottom-10 space-x-6 z-20">
        <button onclick="startRaffleSequence()" id="btn-start" class="bg-blue-600 border-2 border-cyan-400 text-white px-10 py-4 rounded-full text-2xl font-bold hover:bg-blue-500 shadow-[0_0_30px_rgba(6,182,212,0.6)] cursor-pointer tracking-widest">MULAI (15 DETIK)</button>
    </div>

    <script>
        const savedLogo = localStorage.getItem('fgas_raffle_logo');
        if(savedLogo) {
            const logoEl = document.getElementById('raffle-logo');
            logoEl.src = savedLogo;
            logoEl.classList.remove('hidden');
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let oscillator = null;

        function playDrumroll() {
            if(oscillator) return;
            oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(50, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(250, audioCtx.currentTime + 15);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            for(let i = 0; i < 150; i++) {
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime + (i * 0.1));
                gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime + (i * 0.1) + 0.05);
            }
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function playWinSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.8);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 2);
        }

        let interval;
        const names = ["BUDI SANTOSO", "SITI AMINAH", "AGUS PRATAMA", "DEWI LESTARI", "HENDRA GUNAWAN", "RINA MELATI", "DWI CAHYO", "FITRI HANDAYANI"];
        
        function startRaffleSequence() {
            audioCtx.resume();
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('prize-name').innerText = "MENGACAK DATABASE PESERTA...";
            document.getElementById('winner-name').classList.remove('text-green-400');
            
            playDrumroll();
            
            interval = setInterval(() => {
                document.getElementById('winner-name').innerText = names[Math.floor(Math.random() * names.length)];
            }, 60);

            setTimeout(() => { stopRaffle(); }, 15000);
        }

        function stopRaffle() {
            clearInterval(interval);
            if(oscillator) { oscillator.stop(); oscillator = null; }
            playWinSound();
            
            var duration = 5 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 15, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#06b6d4', '#ffffff', '#3b82f6'] });
                confetti({ particleCount: 15, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#06b6d4', '#ffffff', '#3b82f6'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            const targetWinner = localStorage.getItem('fgas_target_winner') || "PEMENANG TERPILIH";
            const targetPrize = localStorage.getItem('fgas_target_prize') || "HADIAH UTAMA";
            
            document.getElementById('winner-name').innerText = targetWinner;
            document.getElementById('prize-name').innerText = "SELAMAT! ANDA MENDAPATKAN: " + targetPrize;
            
            document.getElementById('winner-name').style.color = '#4ade80';
            document.getElementById('winner-name').style.textShadow = '0 0 50px rgba(74,222,128,1)';
            
            setTimeout(() => { document.getElementById('btn-start').style.display = 'block'; }, 5000);
        }
    </script>
</body>
</html>
