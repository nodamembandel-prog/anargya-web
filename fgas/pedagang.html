<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ea580c">
    <title>Scanner Pedagang UMKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style> input { font-size: 16px !important; } </style>
</head>
<body class="bg-orange-50 text-slate-800 font-sans w-full overflow-x-hidden">
    
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-orange-900 absolute inset-0 z-50 px-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-store"></i></div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Login UMKM</h2>
            <input type="text" id="user-name" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-3 focus:ring-2 focus:ring-orange-500 outline-none text-center font-bold" placeholder="Nama Stand">
            <input type="password" id="pwd" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:ring-2 focus:ring-orange-500 outline-none text-center tracking-widest" placeholder="Password">
            <button onclick="login()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold hover:bg-orange-700 transition shadow-lg text-lg">Masuk</button>
        </div>
    </div>

    <div id="main-content" class="hidden min-h-screen flex flex-col">
        <div class="bg-orange-600 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
            <h1 class="font-bold text-lg" id="header-name"><i class="fas fa-store mr-2"></i>Pencairan Voucher</h1>
            <button onclick="logout()" class="bg-red-500 px-3 py-1.5 rounded text-sm font-bold"><i class="fas fa-power-off"></i></button>
        </div>

        <div class="flex-grow p-4 md:p-8 max-w-lg mx-auto w-full space-y-6">
            <div class="bg-white rounded-2xl shadow p-6 text-center border-t-4 border-t-orange-500">
                <h2 class="font-bold text-slate-800 mb-1 text-xl">Scan Voucher Makanan</h2>
                <p class="text-xs text-slate-500 mb-4 bg-orange-50 text-orange-700 p-2 rounded font-bold">Pastikan internet aktif. Voucher senilai Rp 10.000 akan otomatis hangus setelah di scan.</p>
                
                <div id="reader" class="w-full rounded-xl overflow-hidden shadow-inner border-2 border-slate-200 mb-4 bg-black"></div>
                
                <button onclick="startScanner()" id="startScanBtn" class="bg-orange-600 text-white w-full py-4 rounded-xl font-bold hover:bg-orange-700 shadow-md mb-2 text-lg"><i class="fas fa-camera mr-2"></i> BUKA SCANNER</button>
                <button onclick="stopScanner()" id="stopScanBtn" class="bg-red-500 text-white w-full py-4 rounded-xl font-bold hidden text-lg"><i class="fas fa-stop mr-2"></i> BATAL</button>
                
                <div id="scan-result" class="mt-4 hidden p-4 rounded-xl text-center font-bold text-lg border-2"></div>
            </div>
        </div>
    </div>

    <!-- Sync Indicator -->
    <div id="sync-badge" class="fixed bottom-4 left-4 bg-slate-800/90 backdrop-blur border border-slate-700 text-white px-3 py-1.5 rounded-full text-xs font-bold z-50 flex items-center gap-2 opacity-0 transition-opacity">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Online: Sync Active
    </div>

    <script>
        
        const _0xUrl = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3ejNlYlpPc0Y2cURqRmxyY2FwaXYtRWxjVVQxQ0t0Rm5oRGtBTXNMbmRRSEdEOEczZmxkVXJWQmtCQWZSTWU3eDEvZXhlYw==';
        const SCRIPT_URL = atob(_0xUrl);
        const APP_TOKEN = 'FGAS_SECRET_2026';


        window.onload = function() {
            const savedUser = localStorage.getItem('pedagang_auth');
            if(savedUser) {
                document.getElementById('header-name').innerHTML = `<i class="fas fa-store mr-2"></i> ${savedUser}`;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                localStorage.setItem('online_pedagang_' + savedUser, Date.now());
            }
        }

        function login() {
            const pwd = document.getElementById('pwd').value;
            const nm = document.getElementById('user-name').value.trim();
            if(btoa(pwd) === 'dW1rbTEyMw==' && nm) {
                localStorage.setItem('pedagang_auth', nm);
                localStorage.setItem('online_pedagang_' + nm, Date.now());
                location.reload();
            } else { alert('Akses Ditolak! Sandi/Nama Salah.'); document.getElementById('pwd').value = ''; }
        }

        function logout() {
            const nm = localStorage.getItem('pedagang_auth');
            localStorage.removeItem('pedagang_auth');
            localStorage.removeItem('online_pedagang_' + nm);
            location.reload();
        }

        async function processVoucher(voucherId) {
            const resDiv = document.getElementById('scan-result');
            resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2 bg-yellow-100 text-yellow-700 border-yellow-500';
            resDiv.innerHTML = '<i class="fas fa-spinner fa-spin text-3xl mb-2"></i><br>Mengecek Server...';
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'redeem_voucher', token: APP_TOKEN, voucherId: voucherId })
                });
                const result = await response.json();
                
                if(result.status === 'success') {
                    resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2 bg-green-100 text-green-700 border-green-500';
                    resDiv.innerHTML = '<i class="fas fa-check-circle text-5xl mb-2 animate-bounce"></i><br>SUKSES!<br>Voucher Rp 10.000 Diterima.';
                } else {
                    resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2 bg-red-100 text-red-700 border-red-500';
                    resDiv.innerHTML = '<i class="fas fa-times-circle text-5xl mb-2"></i><br>GAGAL!<br><span class="text-sm">' + result.message + '</span>';
                }
            } catch(e) {
                resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2 bg-red-100 text-red-700 border-red-500';
                resDiv.innerHTML = 'Koneksi Internet Terputus!';
            }
        }

        function startScanner() {
            document.getElementById('startScanBtn').classList.add('hidden');
            document.getElementById('stopScanBtn').classList.remove('hidden');
            document.getElementById('scan-result').classList.add('hidden');
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
                stopScanner(); 
                document.getElementById('scan-result').classList.remove('hidden');
                if(!decodedText.startsWith('VOUCHER-')) {
                    const resDiv = document.getElementById('scan-result');
                    resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2 bg-red-100 text-red-700 border-red-500';
                    resDiv.innerHTML = '<i class="fas fa-times text-4xl mb-2"></i><br>BUKAN BARCODE VOUCHER!';
                    return;
                }
                processVoucher(decodedText);
            }).catch(err => { alert("Error Kamera: " + err); stopScanner(); });
        }

        function stopScanner() {
            if(html5QrCode) { html5QrCode.stop().catch(e=>console.log(e)); }
            document.getElementById('startScanBtn').classList.remove('hidden');
            document.getElementById('stopScanBtn').classList.add('hidden');
        }
    </script>
</body>
</html>
