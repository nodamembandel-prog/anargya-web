<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Preview Pengunjung - FGAS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white p-8 font-sans min-h-screen">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-2 text-cyan-400">Live Dashboard Pengunjung FGAS 2026</h1>
        <p class="text-slate-400 mb-8">Pemantauan data pendaftar realtime secara lokal.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h3 class="text-slate-400 font-bold uppercase text-sm mb-2">Total Terdaftar</h3>
                <p id="total-count" class="text-5xl font-black text-white">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h3 class="text-slate-400 font-bold uppercase text-sm mb-2">Total Pengunjung (Doorprize)</h3>
                <p id="visitor-count" class="text-5xl font-black text-cyan-400">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h3 class="text-slate-400 font-bold uppercase text-sm mb-2">Total Peserta Lomba/UMKM</h3>
                <p id="participant-count" class="text-5xl font-black text-orange-400">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h3 class="font-bold text-lg mb-4 text-center">Kategori Kehadiran</h3>
                <canvas id="typeChart"></canvas>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h3 class="font-bold text-lg mb-4 text-center">Distribusi Umur</h3>
                <canvas id="ageChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const visitors = JSON.parse(localStorage.getItem('fgas_visitors')) || [];
        
        document.getElementById('total-count').innerText = visitors.length;
        
        let typeCounts = {};
        let ageCounts = { 'Anak-anak (0-12)': 0, 'Remaja (13-20)': 0, 'Dewasa (21-40)': 0, 'Orang Tua (>40)': 0 };
        let countVisitor = 0;
        let countParticipant = 0;

        visitors.forEach(v => {
            // Count Types
            const baseType = v.type.split(' - ')[0].split(' (')[0]; 
            typeCounts[baseType] = (typeCounts[baseType] || 0) + 1;
            
            if(baseType === 'Pengunjung') countVisitor++;
            else countParticipant++;

            // Count Ages
            const age = parseInt(v.umur);
            if(!isNaN(age)) {
                if(age <= 12) ageCounts['Anak-anak (0-12)']++;
                else if(age <= 20) ageCounts['Remaja (13-20)']++;
                else if(age <= 40) ageCounts['Dewasa (21-40)']++;
                else ageCounts['Orang Tua (>40)']++;
            }
        });

        document.getElementById('visitor-count').innerText = countVisitor;
        document.getElementById('participant-count').innerText = countParticipant;

        // Render Type Chart
        new Chart(document.getElementById('typeChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(typeCounts),
                datasets: [{
                    label: 'Jumlah Pendaftar',
                    data: Object.values(typeCounts),
                    backgroundColor: '#22d3ee',
                    borderRadius: 5
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } } }
        });

        // Render Age Chart
        new Chart(document.getElementById('ageChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(ageCounts),
                datasets: [{
                    data: Object.values(ageCounts),
                    backgroundColor: ['#f472b6', '#fbbf24', '#34d399', '#a78bfa'],
                    borderWidth: 0
                }]
            },
            options: { plugins: { legend: { position: 'right', labels: { color: '#cbd5e1' } } } }
        });
    </script>
</body>
</html>
