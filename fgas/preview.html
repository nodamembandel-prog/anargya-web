<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Preview Pengunjung - FGAS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="text-white p-4 md:p-8 min-h-screen">
    <div class="max-w-7xl mx-auto">
        
        <div class="mb-8 border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Live Traffic Dashboard</h1>
                <p class="text-slate-400">FGAS Boyolali 2026</p>
            </div>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl border-t-4 border-t-blue-500 shadow-lg">
                <h3 class="text-slate-400 font-bold uppercase text-xs mb-2">Total Registrasi</h3>
                <p id="total-count" class="text-5xl font-black text-white">0</p>
            </div>
            <div class="glass-card p-6 rounded-2xl border-t-4 border-t-cyan-400 shadow-lg">
                <h3 class="text-slate-400 font-bold uppercase text-xs mb-2">Pengunjung (Doorprize)</h3>
                <p id="visitor-count" class="text-5xl font-black text-cyan-400">0</p>
            </div>
            <div class="glass-card p-6 rounded-2xl border-t-4 border-t-orange-500 shadow-lg">
                <h3 class="text-slate-400 font-bold uppercase text-xs mb-2">Peserta Lomba/UMKM</h3>
                <p id="participant-count" class="text-5xl font-black text-orange-400">0</p>
            </div>
            <!-- Gender Stats -->
            <div class="glass-card p-6 rounded-2xl border-t-4 border-t-pink-500 shadow-lg">
                <h3 class="text-slate-400 font-bold uppercase text-xs mb-2">Jenis Kelamin</h3>
                <div class="flex justify-between items-end mt-2">
                    <div><span class="text-sm text-slate-400">Laki-laki</span><br><span id="count-l" class="text-2xl font-bold text-blue-300">0</span></div>
                    <div><span class="text-sm text-slate-400">Perempuan</span><br><span id="count-p" class="text-2xl font-bold text-pink-300">0</span></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass-card p-6 rounded-2xl shadow-lg">
                <h3 class="font-bold text-lg mb-6 text-center text-slate-200">Kategori Pendaftar</h3>
                <div class="h-64"><canvas id="typeChart"></canvas></div>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-lg">
                <h3 class="font-bold text-lg mb-6 text-center text-slate-200">Distribusi Umur</h3>
                <div class="h-64 flex justify-center"><canvas id="ageChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        const visitors = JSON.parse(localStorage.getItem('fgas_visitors')) || [];
        
        document.getElementById('total-count').innerText = visitors.length;
        
        let typeCounts = {};
        let ageCounts = { 'Anak (0-12)': 0, 'Remaja (13-20)': 0, 'Dewasa (21-40)': 0, 'Orang Tua (>40)': 0 };
        let countVisitor = 0; let countParticipant = 0;
        let countL = 0; let countP = 0;

        visitors.forEach(v => {
            // Count Types
            const baseType = v.type.split(' - ')[0].split(' (')[0]; 
            typeCounts[baseType] = (typeCounts[baseType] || 0) + 1;
            
            if(baseType === 'Pengunjung') countVisitor++;
            else countParticipant++;

            // Count Ages
            const age = parseInt(v.umur);
            if(!isNaN(age)) {
                if(age <= 12) ageCounts['Anak (0-12)']++;
                else if(age <= 20) ageCounts['Remaja (13-20)']++;
                else if(age <= 40) ageCounts['Dewasa (21-40)']++;
                else ageCounts['Orang Tua (>40)']++;
            }

            // Gender
            if(v.gender === 'Laki-laki') countL++;
            else if(v.gender === 'Perempuan') countP++;
        });

        document.getElementById('visitor-count').innerText = countVisitor;
        document.getElementById('participant-count').innerText = countParticipant;
        document.getElementById('count-l').innerText = countL;
        document.getElementById('count-p').innerText = countP;

        // Render Type Chart
        Chart.defaults.color = '#94a3b8';
        new Chart(document.getElementById('typeChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(typeCounts),
                datasets: [{
                    label: 'Pendaftar',
                    data: Object.values(typeCounts),
                    backgroundColor: '#06b6d4',
                    borderRadius: 4
                }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } } }
        });

        // Render Age Chart
        new Chart(document.getElementById('ageChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(ageCounts),
                datasets: [{
                    data: Object.values(ageCounts),
                    backgroundColor: ['#f472b6', '#3b82f6', '#34d399', '#fbbf24'],
                    borderWidth: 0, hoverOffset: 4
                }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } }, cutout: '70%' }
        });
    </script>
</body>
</html>
