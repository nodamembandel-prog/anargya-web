<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    <title>Scanner Panitia FGAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style> input, select { font-size: 16px !important; box-sizing: border-box; } body { overflow-x: hidden; } </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans w-full">
    
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 absolute inset-0 z-50 px-4 w-full">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-user-shield"></i></div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Login Panitia</h2>
            <input type="text" id="user-name" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-3 focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold" placeholder="Nama Anda">
            <input type="password" id="pwd" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-center tracking-widest" placeholder="Password">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg text-lg mb-4">Masuk Sistem</button>
            <button id="install-app-btn" class="hidden w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-700 transition shadow text-sm border border-slate-600"><i class="fas fa-download mr-2"></i> Install App Panitia</button>
        </div>
    </div>

    <div id="main-content" class="hidden min-h-screen flex flex-col w-full">
        <div class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40 w-full">
            <h1 class="font-bold text-lg" id="header-name"><i class="fas fa-qrcode mr-2"></i>Scanner Panitia</h1>
            <button onclick="logout()" class="bg-red-500 px-3 py-1.5 rounded text-sm font-bold"><i class="fas fa-power-off"></i></button>
        </div>

        <div class="flex-grow p-4 md:p-8 max-w-lg mx-auto w-full space-y-6">
            <div class="bg-white rounded-2xl shadow p-6 text-center border-t-4 border-t-blue-500 w-full">
                <h2 class="font-bold text-slate-800 mb-4 text-lg">Pilih Mode Scanner</h2>
                
                <!-- TAP OPTIONS INSTEAD OF DROPDOWN -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button onclick="setMode('doorprize', this)" class="mode-btn bg-slate-100 text-slate-600 p-3 rounded-xl text-sm font-bold border-2 border-transparent hover:bg-blue-50 transition"><i class="fas fa-gift block text-xl mb-1"></i>Doorprize</button>
                    <button onclick="setMode('peserta', this)" class="mode-btn bg-slate-100 text-slate-600 p-3 rounded-xl text-sm font-bold border-2 border-transparent hover:bg-blue-50 transition"><i class="fas fa-user-check block text-xl mb-1"></i>Cek Peserta</button>
                    <button onclick="setMode('pemenang_lomba', this)" class="mode-btn bg-slate-100 text-slate-600 p-3 rounded-xl text-sm font-bold border-2 border-transparent hover:bg-blue-50 transition"><i class="fas fa-medal block text-xl mb-1"></i>Pemenang</button>
                    <button onclick="setMode('voucher', this)" class="mode-btn bg-slate-100 text-slate-600 p-3 rounded-xl text-sm font-bold border-2 border-transparent hover:bg-blue-50 transition"><i class="fas fa-ticket-alt block text-xl mb-1"></i>Cek Voucher</button>
                </div>
                
                <div id="reader" class="w-full rounded-xl overflow-hidden shadow-inner border-2 border-slate-200 mb-4 bg-black hidden"></div>
                
                <button onclick="startScanner()" id="startScanBtn" class="bg-blue-600 text-white w-full py-4 rounded-xl font-bold hover:bg-blue-700 shadow-md mb-2 text-lg"><i class="fas fa-camera mr-2"></i> BUKA KAMERA</button>
                <button onclick="stopScanner()" id="stopScanBtn" class="bg-red-500 text-white w-full py-4 rounded-xl font-bold hidden text-lg"><i class="fas fa-stop mr-2"></i> TUTUP KAMERA</button>
                
                <div id="scan-result" class="mt-4 hidden p-4 rounded-xl text-center font-bold text-lg border-2"></div>
            </div>

            <!-- List Data & Voucher Tracking -->
            <div class="bg-white rounded-2xl shadow p-6 w-full">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h3 class="font-bold text-slate-700">Tracking Voucher Makan</h3>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-4 text-center">
                    <div class="bg-purple-50 p-2 rounded border border-purple-100"><p class="text-xs text-purple-600 font-bold uppercase tracking-widest">Dicetak</p><p class="text-xl font-black text-purple-900" id="v-total">0</p></div>
                    <div class="bg-orange-50 p-2 rounded border border-orange-100"><p class="text-xs text-orange-600 font-bold uppercase tracking-widest">Digunakan</p><p class="text-xl font-black text-orange-900" id="v-used">0</p></div>
                </div>

                <h3 class="font-bold text-slate-700 border-b pb-2 mb-2 mt-6">Pendaftar UMKM & Lomba</h3>
                <div id="list-pedagang" class="text-sm space-y-2 max-h-40 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <!-- Sync Indicator -->
    <div id="sync-badge" class="fixed bottom-4 left-4 bg-slate-800/90 backdrop-blur border border-slate-700 text-white px-3 py-1.5 rounded-full text-xs font-bold z-50 flex items-center gap-2 opacity-0 transition-opacity">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Sync Active
    </div>

    <script>
        
        const _0xUrl = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3ejNlYlpPc0Y2cURqRmxyY2FwaXYtRWxjVVQxQ0t0Rm5oRGtBTXNMbmRRSEdEOEczZmxkVXJWQmtCQWZSTWU3eDEvZXhlYw==';
        const SCRIPT_URL = atob(_0xUrl);
        const APP_TOKEN = 'FGAS_SECRET_2026';

        
        let html5QrCode;
        let panitiaName = "";
        let currentMode = "doorprize";

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            const installBtn = document.getElementById('install-app-btn');
            installBtn.classList.remove('hidden');
            installBtn.addEventListener('click', () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; installBtn.classList.add('hidden'); });
            });
        });

        window.onload = function() {
            const savedPanitia = localStorage.getItem('panitia_auth');
            if(savedPanitia) {
                document.getElementById('header-name').innerHTML = `<i class="fas fa-user mr-2"></i> Panitia: ${savedPanitia}`;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                fetchData();
                localStorage.setItem('online_panitia_' + savedPanitia, Date.now());
                setInterval(fetchData, 30000);
            }
            // Auto select first mode
            setMode('doorprize', document.querySelector('.mode-btn'));
        }

        function login() {
            const pwd = document.getElementById('pwd').value;
            const nm = document.getElementById('user-name').value.trim();
            if(btoa(pwd) === 'cGFuaXRpYTEyMw==' && nm) {
                localStorage.setItem('panitia_auth', nm);
                localStorage.setItem('online_panitia_' + nm, Date.now());
                location.reload();
            } else { alert('Nama/Password Salah!'); document.getElementById('pwd').value = ''; }
        }

        function logout() {
            const nm = localStorage.getItem('panitia_auth');
            localStorage.removeItem('panitia_auth');
            localStorage.removeItem('online_panitia_' + nm);
            location.reload();
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                b.classList.add('border-transparent', 'bg-slate-100', 'text-slate-600');
            });
            btn.classList.remove('border-transparent', 'bg-slate-100', 'text-slate-600');
            btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
        }

        function renderLists() {
            const visitors = JSON.parse(localStorage.getItem('fgas_visitors')) || [];
            const listDiv = document.getElementById('list-pedagang');
            listDiv.innerHTML = '';
            
            visitors.forEach(v => {
                const type = v.Type || v.type || '';
                if(type !== 'Pengunjung') {
                    const nm = v.Nama || v.nama || '';
                    const hp = v.HP || v.hp || '';
                    listDiv.innerHTML += `<div class="bg-slate-50 p-2 rounded border border-slate-100"><p class="font-bold">${nm} <span class="text-xs text-blue-500">(${hp})</span></p><p class="text-xs text-slate-500">${type}</p></div>`;
                }
            });

            const vouchers = JSON.parse(localStorage.getItem('fgas_vouchers')) || [];
            let used = 0;
            vouchers.forEach(v => {
                if(v.Status === 'Digunakan' || v.status === 'Digunakan') used++;
            });
            document.getElementById('v-total').innerText = vouchers.length;
            document.getElementById('v-used').innerText = used;
        }

        function checkBarcode(scannedId) {
            const resDiv = document.getElementById('scan-result');
            resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2'; 
            
            const visitors = JSON.parse(localStorage.getItem('fgas_visitors')) || [];
            const user = visitors.find(v => v.ticketId === scannedId || v.TicketID === scannedId);

            if(currentMode === 'doorprize') {
                const currentWinnerId = localStorage.getItem('fgas_target_winner') || "NOT_SET";
                if(scannedId === currentWinnerId || currentWinnerId.includes(scannedId)) {
                    resDiv.classList.add('bg-green-100', 'text-green-700', 'border-green-500');
                    resDiv.innerHTML = '<i class="fas fa-trophy text-5xl mb-3 block animate-bounce"></i> SAH! PEMENANG DOORPRIZE<br><span class="text-sm font-bold text-green-900 mt-2 block">Serahkan hadiah kepada peserta ini.</span>';
                } else {
                    resDiv.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
                    resDiv.innerHTML = '<i class="fas fa-times-circle text-5xl mb-3 block"></i> BUKAN PEMENANG<br><span class="text-sm font-bold text-red-900 mt-2 block">Ini hanya tiket masuk biasa.</span>';
                }
            } 
            else if (currentMode === 'peserta') {
                if(user) {
                    resDiv.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-500');
                    resDiv.innerHTML = `<i class="fas fa-user-check text-4xl mb-3 block"></i> TERDAFTAR!<br>Nama: ${user.nama || user.Nama}<br><span class="text-sm font-bold text-blue-900 block mt-2">Kategori: ${user.type || user.Type}</span>`;
                } else {
                    resDiv.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-500');
                    resDiv.innerHTML = '<i class="fas fa-question text-4xl mb-3 block"></i> TIKET TIDAK DITEMUKAN';
                }
            }
            else if (currentMode === 'pemenang_lomba') {
                if(user) {
                    resDiv.classList.add('bg-yellow-100', 'text-yellow-700', 'border-yellow-500');
                    resDiv.innerHTML = `<i class="fas fa-medal text-4xl mb-3 block"></i> VERIFIKASI PEMENANG LOMBA<br>Nama: ${user.nama || user.Nama}<br><span class="text-sm block mt-2">Identitas Valid. Silakan ke meja hadiah.</span>`;
                } else {
                    resDiv.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-500');
                    resDiv.innerHTML = 'TIKET INVALID';
                }
            }
            else if (currentMode === 'voucher') {
                if(scannedId.startsWith('VOUCHER-')) {
                    const vouchers = JSON.parse(localStorage.getItem('fgas_vouchers')) || [];
                    const vInfo = vouchers.find(v => v.VoucherID === scannedId || v.voucherId === scannedId);
                    
                    if(vInfo && (vInfo.Status === 'Digunakan' || vInfo.status === 'Digunakan')) {
                        resDiv.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
                        resDiv.innerHTML = `<i class="fas fa-times text-4xl mb-3 block"></i> VOUCHER SUDAH DIPAKAI!<br><span class="text-sm font-normal">Di Tenant: ${vInfo.Tenant || vInfo.tenant || 'UMKM'}</span>`;
                    } else {
                        resDiv.classList.add('bg-purple-100', 'text-purple-700', 'border-purple-500');
                        resDiv.innerHTML = `<i class="fas fa-ticket-alt text-4xl mb-3 block"></i> VOUCHER AKTIF<br><span class="text-sm font-normal">Silakan tukar di tenant UMKM.</span>`;
                    }
                } else {
                    resDiv.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
                    resDiv.innerHTML = 'BUKAN BARCODE VOUCHER!';
                }
            }
            resDiv.classList.remove('hidden');
        }

        function startScanner() {
            document.getElementById('startScanBtn').classList.add('hidden');
            document.getElementById('stopScanBtn').classList.remove('hidden');
            document.getElementById('scan-result').classList.add('hidden');
            document.getElementById('reader').classList.remove('hidden');
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
                checkBarcode(decodedText);
                stopScanner(); 
            }).catch(err => { alert("Error Kamera: " + err); stopScanner(); });
        }

        function stopScanner() {
            if(html5QrCode) { html5QrCode.stop().catch(e=>console.log(e)); }
            document.getElementById('startScanBtn').classList.remove('hidden');
            document.getElementById('stopScanBtn').classList.add('hidden');
            document.getElementById('reader').classList.add('hidden');
        }

        async function fetchData() {
            try {
                const res = await fetch(SCRIPT_URL + '?token=' + APP_TOKEN);
                const data = await res.json();
                if(data.visitors) localStorage.setItem('fgas_visitors', JSON.stringify(data.visitors));
                if(data.vouchers) localStorage.setItem('fgas_vouchers', JSON.stringify(data.vouchers));
                
                renderLists();
                
                const badge = document.getElementById('sync-badge');
                badge.classList.remove('opacity-0');
                setTimeout(() => badge.classList.add('opacity-0'), 3000);
            } catch (error) { 
                console.log("Offline mode active.");
            }
        }
    </script>
</body>
</html>
