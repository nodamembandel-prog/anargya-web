<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiU2Nhbm5lciBQYW5pdGlhIiwic2hvcnRfbmFtZSI6IlBhbml0aWEiLCJzdGFydF91cmwiOiIuIiwibWFya2V0aW5nX2NvbG9yIjoiIzI1NjNlYiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIn0=">
    <title>Scanner Panitia FGAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 absolute inset-0 z-50 px-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-user-shield"></i></div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Login Panitia</h2>
            <input type="text" id="user-name" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-3 focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold" placeholder="Nama Anda">
            <input type="password" id="pwd" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-center tracking-widest text-xl" placeholder="***">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg text-lg">Masuk Sistem</button>
        </div>
    </div>

    <div id="main-content" class="hidden min-h-screen flex flex-col">
        <div class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
            <h1 class="font-bold text-lg" id="header-name"><i class="fas fa-qrcode mr-2"></i>Scanner Panitia</h1>
            <button onclick="location.reload()" class="bg-red-500 px-3 py-1.5 rounded text-sm font-bold"><i class="fas fa-power-off"></i></button>
        </div>

        <div class="flex-grow p-4 md:p-8 max-w-lg mx-auto w-full space-y-6">
            
            <div class="bg-white rounded-2xl shadow p-6 text-center border-t-4 border-t-blue-500">
                <h2 class="font-bold text-slate-800 mb-4 text-lg">Pilih Mode Scanner</h2>
                <select id="scan-mode" class="w-full p-3 border-2 border-blue-200 rounded-xl font-bold text-blue-800 outline-none focus:border-blue-500 mb-4">
                    <option value="doorprize">1. Verifikasi Pemenang Doorprize</option>
                    <option value="peserta">2. Verifikasi Data Pendaftar Lomba</option>
                    <option value="pemenang_lomba">3. Verifikasi Pemenang Lomba</option>
                    <option value="voucher">4. Verifikasi Voucher Pengunjung</option>
                </select>
                
                <div id="reader" class="w-full rounded-xl overflow-hidden shadow-inner border-2 border-slate-200 mb-4 bg-black"></div>
                
                <button onclick="startScanner()" id="startScanBtn" class="bg-blue-600 text-white w-full py-4 rounded-xl font-bold hover:bg-blue-700 shadow-md mb-2 text-lg"><i class="fas fa-camera mr-2"></i> BUKA KAMERA</button>
                <button onclick="stopScanner()" id="stopScanBtn" class="bg-red-500 text-white w-full py-4 rounded-xl font-bold hidden text-lg"><i class="fas fa-stop mr-2"></i> TUTUP KAMERA</button>
                
                <div id="scan-result" class="mt-4 hidden p-4 rounded-xl text-center font-bold text-lg border-2"></div>
            </div>
            
            <div class="text-center pt-4"><button onclick="fetchData()" class="text-blue-500 font-bold underline bg-white px-6 py-3 rounded-full shadow-sm"><i class="fas fa-sync-alt mr-1"></i> Sync DB Google Sheets</button></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwz3ebZOsF6qDjFlrcapiv-ElcUT1CKtFnhDkAMsLndQHGD8G3fldUrVBkBAfRMe7x1/exec'; 
        let html5QrCode;
        let panitiaName = "";

        function login() {
            const pwd = document.getElementById('pwd').value;
            const nm = document.getElementById('user-name').value;
            if(pwd === 'panitia123' && nm) {
                panitiaName = nm;
                document.getElementById('header-name').innerHTML = `<i class="fas fa-user mr-2"></i> Panitia: ${nm}`;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                fetchData();
            } else { alert('Nama harus diisi dan Akses Ditolak!'); document.getElementById('pwd').value = ''; }
        }

        function checkBarcode(scannedId) {
            const mode = document.getElementById('scan-mode').value;
            const resDiv = document.getElementById('scan-result');
            resDiv.className = 'mt-4 p-4 rounded-xl text-center font-bold text-lg border-2'; 
            
            const visitors = JSON.parse(localStorage.getItem('fgas_visitors')) || [];
            const user = visitors.find(v => v.ticketId === scannedId || v.TicketID === scannedId);

            if(mode === 'doorprize') {
                const currentWinnerId = localStorage.getItem('fgas_target_winner') || "NOT_SET";
                if(scannedId === currentWinnerId || currentWinnerId.includes(scannedId)) {
                    resDiv.classList.add('bg-green-100', 'text-green-700', 'border-green-500');
                    resDiv.innerHTML = '<i class="fas fa-trophy text-5xl mb-3 block animate-bounce"></i> SAH! PEMENANG DOORPRIZE<br><span class="text-sm font-bold text-green-900 mt-2 block">Serahkan hadiah kepada peserta ini.</span>';
                } else {
                    resDiv.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
                    resDiv.innerHTML = '<i class="fas fa-times-circle text-5xl mb-3 block"></i> BUKAN PEMENANG<br><span class="text-sm font-bold text-red-900 mt-2 block">Ini hanya tiket masuk biasa.</span>';
                }
            } 
            else if (mode === 'peserta') {
                if(user) {
                    resDiv.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-500');
                    resDiv.innerHTML = `<i class="fas fa-user-check text-4xl mb-3 block"></i> TERDAFTAR!<br>Nama: ${user.nama || user.Nama}<br><span class="text-sm font-bold text-blue-900 block mt-2">Kategori: ${user.type || user.Type}</span>`;
                } else {
                    resDiv.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-500');
                    resDiv.innerHTML = '<i class="fas fa-question text-4xl mb-3 block"></i> TIKET TIDAK DITEMUKAN';
                }
            }
            else if (mode === 'pemenang_lomba') {
                if(user) {
                    resDiv.classList.add('bg-yellow-100', 'text-yellow-700', 'border-yellow-500');
                    resDiv.innerHTML = `<i class="fas fa-medal text-4xl mb-3 block"></i> VERIFIKASI PEMENANG LOMBA<br>Nama: ${user.nama || user.Nama}<br><span class="text-sm block mt-2">Identitas Valid. Silakan ke meja hadiah.</span>`;
                } else {
                    resDiv.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-500');
                    resDiv.innerHTML = 'TIKET INVALID';
                }
            }
            else if (mode === 'voucher') {
                if(scannedId.startsWith('VOUCHER-')) {
                    resDiv.classList.add('bg-purple-100', 'text-purple-700', 'border-purple-500');
                    resDiv.innerHTML = `<i class="fas fa-ticket-alt text-4xl mb-3 block"></i> VOUCHER ASLI<br><span class="text-sm">Silakan tukar di tenant UMKM.</span>`;
                } else {
                    resDiv.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
                    resDiv.innerHTML = 'BUKAN BARCODE VOUCHER!';
                }
            }
            
            resDiv.classList.remove('hidden');
        }

        function startScanner() {
            document.getElementById('startScanBtn').classList.add('hidden');
            document.getElementById('stopScanBtn').classList.remove('hidden');
            document.getElementById('scan-result').classList.add('hidden');
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
                checkBarcode(decodedText);
                stopScanner(); 
            }).catch(err => { alert("Error: " + err); stopScanner(); });
        }

        function stopScanner() {
            if(html5QrCode) { html5QrCode.stop().catch(e=>console.log(e)); }
            document.getElementById('startScanBtn').classList.remove('hidden');
            document.getElementById('stopScanBtn').classList.add('hidden');
        }

        async function fetchData() {
            try {
                if (SCRIPT_URL.startsWith('http')) {
                    const res = await fetch(SCRIPT_URL);
                    const data = await res.json();
                    if(data.visitors) localStorage.setItem('fgas_visitors', JSON.stringify(data.visitors));
                    alert("Sync Berhasil!");
                }
            } catch (error) { console.log(error); }
        }
    </script>
</body>
</html>
