<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCAN HERE - FGAS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-12 rounded-[3rem] shadow-2xl text-center max-w-lg w-full">
        <h1 class="text-4xl font-black text-gray-900 mb-2 tracking-tight">SCAN & DAFTAR</h1>
        <p class="text-gray-500 font-semibold mb-8 uppercase tracking-widest text-sm">FGAS Boyolali 2026</p>
        
        <div class="border-4 border-dashed border-blue-500 p-4 rounded-3xl inline-block mb-8">
            <div id="promo-qrcode"></div>
        </div>
        
        <a href="index.html" class="block w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition">Atau Klik Disini</a>
    </div>
    <script>
        const formUrl = window.location.href.replace('scan.html', 'index.html');
        new QRCode(document.getElementById("promo-qrcode"), { text: formUrl, width: 250, height: 250, colorDark : "#000000", colorLight : "#ffffff" });
    </script>
</body>
</html>
