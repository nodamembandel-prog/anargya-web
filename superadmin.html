<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Superadmin System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-900 absolute inset-0 z-50 px-4">
        <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fas fa-lock"></i></div>
            <h2 class="text-xl font-bold mb-6">Akses Master Control</h2>
            <input type="password" id="pwd" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl mb-4 text-center tracking-widest outline-none focus:border-red-500 text-2xl" placeholder="***">
            <button onclick="login()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold hover:bg-red-700 shadow-lg transition text-lg">Masuk</button>
            <a href="index.html" class="block mt-6 text-sm text-gray-400">Kembali ke Beranda</a>
        </div>
    </div>
    <div id="main-content" class="hidden max-w-5xl mx-auto py-10 px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold"><i class="fas fa-cogs mr-2 text-gray-400"></i> Global Settings</h1>
            <button onclick="location.reload()" class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold text-sm shadow">Logout</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- Sosmed Settings -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border">
                <h2 class="font-bold mb-4">Pengaturan Social Media URL</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">WhatsApp URL</label>
                        <input type="text" id="wa-input" class="w-full border p-3 rounded-lg bg-gray-50 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">Instagram URL</label>
                        <input type="text" id="ig-input" class="w-full border p-3 rounded-lg bg-gray-50 outline-none focus:border-blue-500">
                    </div>
                    <button onclick="saveSocial()" class="bg-gray-900 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-gray-800 w-full">Simpan Sosmed</button>
                </div>
            </div>

            <!-- Upload Foto Layanan (Gallery) -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-orange-200">
                <h2 class="font-bold mb-4 text-orange-600"><i class="fas fa-images mr-2"></i>Upload Foto Layanan</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">Pilih Bidang Layanan</label>
                        <select id="gallery-category" class="w-full border p-3 rounded-lg bg-gray-50 outline-none font-bold">
                            <option value="event">Event Organizer</option>
                            <option value="pengadaan">Pengadaan Barang</option>
                            <option value="tour">Tour & Travel</option>
                            <option value="video">Video & Fotografi</option>
                            <option value="ads">Advertising</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">Pilih Foto Kegiatan</label>
                        <input type="file" id="gallery-upload" accept="image/*" class="w-full border p-2 rounded-lg bg-gray-50">
                    </div>
                    <button onclick="uploadServicePhoto()" class="bg-orange-500 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-orange-600 w-full">Tambah ke Galeri Layanan</button>
                    <button onclick="clearGallery()" class="text-xs text-red-500 underline text-center w-full block mt-2">Hapus Semua Galeri</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <a href="index.html" class="bg-white border text-gray-800 p-6 rounded-2xl shadow hover:shadow-lg transition text-center">
                <i class="fas fa-globe text-3xl mb-2 text-gray-400"></i><h3 class="font-bold">Landing Page Utama</h3>
            </a>
            <a href="fgas/admin.html" class="bg-blue-600 text-white p-6 rounded-2xl shadow hover:shadow-lg transition text-center">
                <i class="fas fa-mobile-alt text-3xl mb-2"></i><h3 class="font-bold">Scanner Panitia (App)</h3>
            </a>
            <a href="fgas/admin-internal.html" class="bg-purple-600 text-white p-6 rounded-2xl shadow hover:shadow-lg transition text-center">
                <i class="fas fa-desktop text-3xl mb-2"></i><h3 class="font-bold">Admin Layar LED</h3>
            </a>
        </div>
    </div>
    <script>
        function login() {
            if(document.getElementById('pwd').value === 'amansekali') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('wa-input').value = localStorage.getItem('anargya_wa') || '';
                document.getElementById('ig-input').value = localStorage.getItem('anargya_ig') || '';
            } else { alert('Gagal'); document.getElementById('pwd').value = ''; }
        }
        function saveSocial() {
            localStorage.setItem('anargya_wa', document.getElementById('wa-input').value);
            localStorage.setItem('anargya_ig', document.getElementById('ig-input').value);
            alert('Tersimpan!');
        }
        function uploadServicePhoto() {
            const file = document.getElementById('gallery-upload').files[0];
            const category = document.getElementById('gallery-category').value;
            if(!file) { alert('Pilih foto terlebih dahulu.'); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Compress image size
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    let galleries = JSON.parse(localStorage.getItem('anargya_galleries')) || {};
                    if(!galleries[category]) galleries[category] = [];
                    galleries[category].push(dataUrl);
                    localStorage.setItem('anargya_galleries', JSON.stringify(galleries));
                    alert('Foto berhasil ditambahkan ke layanan!');
                    document.getElementById('gallery-upload').value = '';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
        function clearGallery() {
            if(confirm('Hapus semua foto galeri layanan?')) {
                localStorage.removeItem('anargya_galleries');
                alert('Galeri dibersihkan.');
            }
        }
    </script>
</body>
</html>
