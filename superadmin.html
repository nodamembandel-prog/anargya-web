<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Superadmin - Anargya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-3xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Superadmin Anargya</h1>
        
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-bold mb-4">Pengaturan Social Media</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700">Link WhatsApp</label>
                    <input type="text" id="wa-input" class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-gray-700">Link Instagram</label>
                    <input type="text" id="ig-input" class="w-full border p-2 rounded mt-1">
                </div>
                <button onclick="saveSocial()" class="bg-orange-500 text-white px-4 py-2 rounded">Simpan Sosmed</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">Kembali ke Web</h2>
            <a href="index.html" class="text-blue-500 underline">Lihat Website Utama</a>
        </div>
    </div>

    <script>
        document.getElementById('wa-input').value = localStorage.getItem('anargya_wa') || '';
        document.getElementById('ig-input').value = localStorage.getItem('anargya_ig') || '';

        function saveSocial() {
            localStorage.setItem('anargya_wa', document.getElementById('wa-input').value);
            localStorage.setItem('anargya_ig', document.getElementById('ig-input').value);
            alert('Tersimpan!');
        }
    </script>
</body>
</html>
